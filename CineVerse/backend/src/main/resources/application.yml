spring:
  application:
    name: cineverse
  profiles:
    default: dev
  datasource:
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/cineverse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:cineverse}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_TLS:false}
      mail.smtp.starttls.required: ${MAIL_TLS:false}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 250MB
      max-request-size: 251MB
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-swallow-size: 251MB
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never
app:
  admin-url: ${ADMIN_URL:http://localhost:5174}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt-secret: ${JWT_SECRET:}
  secure-cookie: ${SECURE_COOKIE:false}
  media-root: ${MEDIA_ROOT:../demo-media}
  upload-root: ${UPLOAD_ROOT:../uploads}
  mail-from: ${MAIL_FROM:noreply@cineverse.local}
  admin-email: ${ADMIN_NOTIFICATION_EMAIL:admin@cineverse.local}
  demo-password: ${DEMO_PASSWORD:}
  payments:
    mode: ${PAYMENT_MODE:disabled}
    payos:
      enabled: ${PAYOS_ENABLED:false}
      client-id: ${PAYOS_CLIENT_ID:}
      api-key: ${PAYOS_API_KEY:}
      checksum-key: ${PAYOS_CHECKSUM_KEY:}
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay/return}
      client-ip: ${VNPAY_CLIENT_IP:127.0.0.1}
    momo:
      partner-code: ${MOMO_PARTNER_CODE:}
      access-key: ${MOMO_ACCESS_KEY:}
      secret-key: ${MOMO_SECRET_KEY:}
      redirect-url: ${MOMO_REDIRECT_URL:http://localhost:5173/thanh-toan/ket-qua}
      ipn-url: ${MOMO_IPN_URL:}
