name: cineverse
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cineverse
      MYSQL_USER: cineverse
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run scripts/setup-env.ps1 first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/setup-env.ps1 first}
      TZ: UTC
    ports: ["127.0.0.1:3307:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.22.3
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    volumes: ["mailpit-data:/data"]
    environment:
      MP_DATABASE: /data/mailpit.db
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/cineverse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: cineverse
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      MAIL_HOST: mailpit
      MEDIA_ROOT: /app/media
      UPLOAD_ROOT: /app/uploads
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./demo-media:/app/media", "./uploads:/app/uploads"]
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on: [backend]
    restart: unless-stopped
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    ports: ["127.0.0.1:5174:80"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  mysql-data:
  mailpit-data:
